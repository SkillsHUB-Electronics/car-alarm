name: Build firmware

# Compiles firmware/car_alarm for the web console (GitHub Pages), which cannot run a compiler itself.
# The console dispatches this workflow with the options below, polls the run and downloads the artifact.
run-name: Firmware ${{ inputs.build_id || github.sha }}

on:
  pull_request:
    paths: ['.github/workflows/build-firmware.yml']   # a PR that edits this workflow builds both boards as a check
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique id set by the console so it can find its own run'
        required: false
        default: ''
      board:
        description: 'Target board'
        type: choice
        options: [uno, esp32]
        default: uno
      power_enabled:
        description: 'Compile the Power module (INA219 + charger CHRG pin)'
        type: choice
        options: ['0', '1']
        default: '0'
      pin_chrg:
        description: 'CHRG pin (empty = default)'
        required: false
        default: ''
      ina_addr:
        description: 'INA219 I2C address, e.g. 0x40 (empty = default)'
        required: false
        default: ''
      ina_shunt_mohm:
        description: 'Shunt resistor in milliohm (empty = default)'
        required: false
        default: ''
      build_flags:
        description: 'Space-separated NAME=VALUE pairs: pin overrides, I2C addresses, INC_* interface switches (whitelisted)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # dispatch: the one board asked for; pull request: both boards
        board: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.board) || '["uno","esp32"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2

      - name: Validate inputs and build compiler flags
        id: flags
        env:
          POWER: ${{ inputs.power_enabled }}
          CHRG: ${{ inputs.pin_chrg }}
          INA: ${{ inputs.ina_addr }}
          SHUNT: ${{ inputs.ina_shunt_mohm }}
          EXTRA: ${{ inputs.build_flags }}
        run: |
          # Inputs come from a browser: accept only plain numbers, never pass free text to the compiler.
          flags=""
          [[ "${POWER:-0}" =~ ^[01]$ ]] || { echo "bad power_enabled"; exit 1; }
          flags="-DPOWER_ENABLED=${POWER:-0}"
          if [ -n "$CHRG" ]; then [[ "$CHRG" =~ ^[0-9]{1,2}$ ]] || { echo "bad pin_chrg"; exit 1; }; flags="$flags -DPIN_CHRG=$CHRG"; fi
          if [ -n "$INA" ]; then [[ "$INA" =~ ^(0x[0-9a-fA-F]{1,2}|[0-9]{1,3})$ ]] || { echo "bad ina_addr"; exit 1; }; flags="$flags -DINA_ADDR=$INA"; fi
          if [ -n "$SHUNT" ]; then [[ "$SHUNT" =~ ^[0-9]{1,5}$ ]] || { echo "bad ina_shunt_mohm"; exit 1; }; flags="$flags -DINA_SHUNT_MOHM=$SHUNT"; fi
          # Pin / address / interface overrides from the Config page: names are whitelisted, values are plain numbers.
          for pair in $EXTRA; do
            name="${pair%%=*}"; val="${pair#*=}"
            case "$name" in
              INC_DIST|INC_BT|INC_BUZZER|INC_LED|INC_LCD|INC_MPU) [[ "$val" =~ ^[01]$ ]] || { echo "bad value for $name"; exit 1; } ;;
              PIN_TRIG|PIN_ECHO|PIN_BT_RX|PIN_BT_TX|PIN_BUZZER|PIN_LED_RED|PIN_LED_GREEN|PIN_LED_YELLOW|LCD_ADDR|MPU_ADDR)
                [[ "$val" =~ ^(0x[0-9a-fA-F]{1,2}|[0-9]{1,3})$ ]] || { echo "bad value for $name"; exit 1; } ;;
              *) echo "unknown build flag: $name"; exit 1 ;;
            esac
            flags="$flags -D$name=$val"
          done
          echo "flags=$flags" >> "$GITHUB_OUTPUT"

      - name: Install core and libraries
        env:
          BOARD: ${{ matrix.board }}
        run: |
          arduino-cli config init
          if [ "$BOARD" = esp32 ]; then
            arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
            arduino-cli core update-index
            arduino-cli core install esp32:esp32
            echo "FQBN=esp32:esp32:esp32" >> "$GITHUB_ENV"
          else
            arduino-cli core update-index
            arduino-cli core install arduino:avr
            echo "FQBN=arduino:avr:uno" >> "$GITHUB_ENV"
          fi
          arduino-cli lib install "LiquidCrystal I2C"

      - name: Compile
        env:
          FLAGS: ${{ steps.flags.outputs.flags }}
        run: |
          arduino-cli compile --fqbn "$FQBN" \
            --build-property "build.extra_flags=$FLAGS" \
            --output-dir out firmware/car_alarm 2>&1 | tee compile.log

      - name: Collect result
        env:
          BOARD: ${{ matrix.board }}
        run: |
          mkdir dist
          if [ "$BOARD" = esp32 ]; then
            cp out/car_alarm.ino.merged.bin dist/firmware.bin   # bootloader + partitions + app, flash at 0x0
          else
            cp out/car_alarm.ino.hex dist/firmware.hex
          fi
          grep -E "Sketch uses|Global variables" compile.log > dist/size.txt || true
          cat > dist/build.json <<JSON
          {"board":"$BOARD","sha":"${{ github.sha }}","flags":"${{ steps.flags.outputs.flags }}"}
          JSON
          cat dist/size.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && 'firmware' || format('firmware-{0}', matrix.board) }}
          path: dist/
          retention-days: 7
