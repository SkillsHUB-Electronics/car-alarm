name: Release

# Push a tag such as v2.1.0 to build firmware, APK and console zip and attach them to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2
      - name: Build firmware
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install "LiquidCrystal I2C"
          arduino-cli compile --fqbn arduino:avr:uno --output-dir out/firmware firmware/car_alarm
          cp out/firmware/car_alarm.ino.hex "car-alarm-firmware-${GITHUB_REF_NAME}.hex"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Build Android app (debug-signed APK)
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../car-alarm-app-${GITHUB_REF_NAME}.apk"

      - name: Package web console (local helper included)
        run: |
          zip -r "car-alarm-console-${GITHUB_REF_NAME}.zip" console -x "console/test/*"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            car-alarm-firmware-*.hex
            car-alarm-app-*.apk
            car-alarm-console-*.zip
