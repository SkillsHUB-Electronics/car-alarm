name: Deploy web console

on:
  push:
    branches: [main]
    paths: ['console/index.html', 'console/ml.js', 'console/cloud.js', 'console/sw.js', 'console/manifest.webmanifest', 'console/icon-*.png', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp console/index.html console/ml.js console/cloud.js console/sw.js console/manifest.webmanifest console/icon-*.png _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
