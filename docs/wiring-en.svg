<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="1120" height="900" fill="#ffffff"/>
  <text x="560" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Wiring Diagram: Car Distance &amp; Shock Alarm (Arduino UNO)</text>

  <!-- ================= ARDUINO ================= -->
  <rect x="400" y="90" width="300" height="610" rx="8" fill="#e6f0fa" stroke="#1d4f8c" stroke-width="2"/>
  <text x="550" y="380" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d4f8c">ARDUINO UNO</text>
  <text x="550" y="402" text-anchor="middle" fill="#1d4f8c">ATmega328P, 5 V</text>
  <text x="550" y="422" text-anchor="middle" fill="#1d4f8c">power: car USB charger</text>

  <!-- 5V / GND of Arduino -->
  <line x1="550" y1="90" x2="550" y2="62" stroke="#d62020" stroke-width="3"/>
  <text x="550" y="54" text-anchor="middle" fill="#d62020" font-weight="bold">5V → every point labeled 5V</text>
  <line x1="550" y1="700" x2="550" y2="728" stroke="#111" stroke-width="3"/>
  <text x="550" y="746" text-anchor="middle" fill="#111" font-weight="bold">GND → every point labeled GND</text>

  <!-- Arduino left pin labels -->
  <g fill="#1d4f8c" font-weight="bold">
    <text x="410" y="154">D2 (TRIG)</text>
    <text x="410" y="194">D3 (ECHO)</text>
    <text x="410" y="434">A4 (SDA)</text>
    <text x="410" y="474">A5 (SCL)</text>
  </g>
  <!-- Arduino right pin labels -->
  <g fill="#1d4f8c" font-weight="bold" text-anchor="end">
    <text x="692" y="134">D10 (BT RX)</text>
    <text x="692" y="194">D11 (BT TX)</text>
    <text x="692" y="334">D8 (buzzer)</text>
    <text x="692" y="434">D5 (red LED)</text>
    <text x="692" y="494">D6 (green LED)</text>
    <text x="692" y="554">D7 (yellow LED)</text>
  </g>

  <!-- ================= HC-SR04 ================= -->
  <text x="180" y="90" text-anchor="middle" font-weight="bold" font-size="14">HC-SR04 (distance)</text>
  <rect x="100" y="100" width="160" height="160" rx="6" fill="#f4f6f8" stroke="#333" stroke-width="1.5"/>
  <g font-size="11">
    <text x="108" y="134">VCC</text>
    <text x="108" y="234">GND</text>
    <text x="252" y="154" text-anchor="end">TRIG</text>
    <text x="252" y="194" text-anchor="end">ECHO</text>
  </g>
  <line x1="100" y1="130" x2="70" y2="130" stroke="#d62020" stroke-width="2.5"/>
  <text x="64" y="134" text-anchor="end" fill="#d62020" font-weight="bold">5V</text>
  <line x1="100" y1="230" x2="70" y2="230" stroke="#111" stroke-width="2.5"/>
  <text x="64" y="234" text-anchor="end" fill="#111" font-weight="bold">GND</text>
  <line x1="260" y1="150" x2="400" y2="150" stroke="#e67e00" stroke-width="2.5"/>
  <line x1="260" y1="190" x2="400" y2="190" stroke="#e67e00" stroke-width="2.5"/>
  <text x="330" y="144" text-anchor="middle" font-size="11" fill="#e67e00">orange</text>
  <text x="330" y="184" text-anchor="middle" font-size="11" fill="#e67e00">orange</text>

  <!-- ================= MPU6050 ================= -->
  <text x="180" y="350" text-anchor="middle" font-weight="bold" font-size="14">MPU6050 / GY-521 (0x68)</text>
  <rect x="100" y="360" width="160" height="160" rx="6" fill="#f4f6f8" stroke="#333" stroke-width="1.5"/>
  <g font-size="11">
    <text x="108" y="389">VCC</text>
    <text x="108" y="454">AD0</text>
    <text x="108" y="499">GND</text>
    <text x="252" y="434" text-anchor="end">SDA</text>
    <text x="252" y="474" text-anchor="end">SCL</text>
    <text x="180" y="512" text-anchor="middle" fill="#777">INT, XDA, XCL: not used</text>
  </g>
  <line x1="100" y1="385" x2="70" y2="385" stroke="#d62020" stroke-width="2.5"/>
  <text x="64" y="389" text-anchor="end" fill="#d62020" font-weight="bold">5V</text>
  <line x1="100" y1="450" x2="70" y2="450" stroke="#111" stroke-width="2.5"/>
  <text x="64" y="454" text-anchor="end" fill="#111" font-weight="bold">GND</text>
  <line x1="100" y1="495" x2="70" y2="495" stroke="#111" stroke-width="2.5"/>
  <text x="64" y="499" text-anchor="end" fill="#111" font-weight="bold">GND</text>

  <!-- ================= LCD ================= -->
  <text x="180" y="550" text-anchor="middle" font-weight="bold" font-size="14">LCD 16x2 + I2C backpack (0x27)</text>
  <rect x="100" y="560" width="160" height="120" rx="6" fill="#f4f6f8" stroke="#333" stroke-width="1.5"/>
  <g font-size="11">
    <text x="108" y="589">VCC</text>
    <text x="108" y="659">GND</text>
    <text x="252" y="604" text-anchor="end">SDA</text>
    <text x="252" y="644" text-anchor="end">SCL</text>
  </g>
  <line x1="100" y1="585" x2="70" y2="585" stroke="#d62020" stroke-width="2.5"/>
  <text x="64" y="589" text-anchor="end" fill="#d62020" font-weight="bold">5V</text>
  <line x1="100" y1="655" x2="70" y2="655" stroke="#111" stroke-width="2.5"/>
  <text x="64" y="659" text-anchor="end" fill="#111" font-weight="bold">GND</text>

  <!-- ================= I2C bus (shared) ================= -->
  <!-- SDA -->
  <polyline points="400,430 260,430" fill="none" stroke="#1f6feb" stroke-width="2.5"/>
  <polyline points="340,430 340,600 260,600" fill="none" stroke="#1f6feb" stroke-width="2.5"/>
  <circle cx="340" cy="430" r="4.5" fill="#1f6feb"/>
  <text x="372" y="424" text-anchor="middle" font-size="11" fill="#1f6feb" font-weight="bold">SDA</text>
  <!-- SCL -->
  <polyline points="400,470 260,470" fill="none" stroke="#1a9a3a" stroke-width="2.5"/>
  <polyline points="300,470 300,640 260,640" fill="none" stroke="#1a9a3a" stroke-width="2.5"/>
  <circle cx="300" cy="470" r="4.5" fill="#1a9a3a"/>
  <text x="372" y="464" text-anchor="middle" font-size="11" fill="#1a9a3a" font-weight="bold">SCL</text>

  <!-- ================= HC-05 ================= -->
  <text x="910" y="80" text-anchor="middle" font-weight="bold" font-size="14">HC-05 (Bluetooth SPP)</text>
  <rect x="820" y="90" width="180" height="150" rx="6" fill="#f4f6f8" stroke="#333" stroke-width="1.5"/>
  <g font-size="11">
    <text x="828" y="134">TXD</text>
    <text x="828" y="194">RXD</text>
    <text x="992" y="114" text-anchor="end">VCC</text>
    <text x="992" y="224" text-anchor="end">GND</text>
    <text x="910" y="168" text-anchor="middle" fill="#777">EN, STATE: not used</text>
  </g>
  <line x1="1000" y1="110" x2="1030" y2="110" stroke="#d62020" stroke-width="2.5"/>
  <text x="1036" y="114" fill="#d62020" font-weight="bold">5V</text>
  <line x1="1000" y1="220" x2="1030" y2="220" stroke="#111" stroke-width="2.5"/>
  <text x="1036" y="224" fill="#111" font-weight="bold">GND</text>
  <!-- D10 <- TXD -->
  <line x1="700" y1="130" x2="820" y2="130" stroke="#e67e00" stroke-width="2.5"/>
  <text x="760" y="124" text-anchor="middle" font-size="11" fill="#e67e00">direct</text>
  <!-- D11 -> divider -> RXD -->
  <line x1="700" y1="190" x2="730" y2="190" stroke="#e67e00" stroke-width="2.5"/>
  <rect x="730" y="182" width="50" height="16" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="755" y="177" text-anchor="middle" font-size="11">R1 1 kΩ</text>
  <line x1="780" y1="190" x2="820" y2="190" stroke="#e67e00" stroke-width="2.5"/>
  <circle cx="800" cy="190" r="4.5" fill="#e67e00"/>
  <line x1="800" y1="190" x2="800" y2="215" stroke="#e67e00" stroke-width="2.5"/>
  <rect x="792" y="215" width="16" height="40" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="786" y="238" text-anchor="end" font-size="11">R2 2 kΩ</text>
  <line x1="800" y1="255" x2="800" y2="275" stroke="#111" stroke-width="2.5"/>
  <text x="800" y="289" text-anchor="middle" fill="#111" font-weight="bold">GND</text>
  <text x="780" y="214" text-anchor="end" font-size="11" fill="#b00020" font-weight="bold">≈3.3 V</text>

  <!-- ================= BUZZER + NPN ================= -->
  <line x1="700" y1="330" x2="730" y2="330" stroke="#e67e00" stroke-width="2.5"/>
  <rect x="730" y="322" width="50" height="16" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="755" y="317" text-anchor="middle" font-size="11">R3 1 kΩ</text>
  <line x1="780" y1="330" x2="868" y2="330" stroke="#e67e00" stroke-width="2.5"/>
  <!-- transistor -->
  <circle cx="880" cy="330" r="22" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <line x1="868" y1="317" x2="868" y2="343" stroke="#333" stroke-width="3"/>
  <line x1="868" y1="324" x2="890" y2="308" stroke="#333" stroke-width="2"/>
  <line x1="868" y1="336" x2="890" y2="352" stroke="#333" stroke-width="2"/>
  <polygon points="890,352 880,350 886,343" fill="#333"/>
  <text x="858" y="324" text-anchor="end" font-size="11">B</text>
  <text x="900" y="316" font-size="11">C</text>
  <text x="900" y="352" font-size="11">E</text>
  <text x="838" y="372" text-anchor="end" font-size="11">Q1 NPN 2N2222 / BC547</text>
  <!-- collector -> buzzer (-) -->
  <polyline points="890,308 890,295 930,295" fill="none" stroke="#e67e00" stroke-width="2.5"/>
  <!-- emitter -> GND -->
  <line x1="890" y1="352" x2="890" y2="380" stroke="#111" stroke-width="2.5"/>
  <text x="890" y="394" text-anchor="middle" fill="#111" font-weight="bold">GND</text>
  <!-- buzzer -->
  <text x="990" y="262" text-anchor="middle" font-weight="bold" font-size="14">Active buzzer</text>
  <rect x="930" y="270" width="120" height="60" rx="6" fill="#f4f6f8" stroke="#333" stroke-width="1.5"/>
  <text x="938" y="299" font-size="13" font-weight="bold">−</text>
  <text x="1042" y="319" text-anchor="end" font-size="13" font-weight="bold">+</text>
  <line x1="1050" y1="315" x2="1078" y2="315" stroke="#d62020" stroke-width="2.5"/>
  <text x="1084" y="319" fill="#d62020" font-weight="bold">5V</text>

  <!-- ================= LEDs ================= -->
  <!-- red D5 -->
  <line x1="700" y1="430" x2="730" y2="430" stroke="#e67e00" stroke-width="2.5"/>
  <rect x="730" y="422" width="50" height="16" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="755" y="417" text-anchor="middle" font-size="11">220 Ω</text>
  <line x1="780" y1="430" x2="835" y2="430" stroke="#e67e00" stroke-width="2.5"/>
  <polygon points="835,419 835,441 858,430" fill="#e02020" stroke="#333" stroke-width="1.5"/>
  <line x1="858" y1="419" x2="858" y2="441" stroke="#333" stroke-width="2.5"/>
  <line x1="858" y1="430" x2="930" y2="430" stroke="#111" stroke-width="2.5"/>
  <text x="936" y="434" fill="#111" font-weight="bold">GND</text>
  <text x="846" y="412" text-anchor="middle" font-size="11">Red LED</text>
  <!-- green D6 -->
  <line x1="700" y1="490" x2="730" y2="490" stroke="#e67e00" stroke-width="2.5"/>
  <rect x="730" y="482" width="50" height="16" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="755" y="477" text-anchor="middle" font-size="11">220 Ω</text>
  <line x1="780" y1="490" x2="835" y2="490" stroke="#e67e00" stroke-width="2.5"/>
  <polygon points="835,479 835,501 858,490" fill="#22a83a" stroke="#333" stroke-width="1.5"/>
  <line x1="858" y1="479" x2="858" y2="501" stroke="#333" stroke-width="2.5"/>
  <line x1="858" y1="490" x2="930" y2="490" stroke="#111" stroke-width="2.5"/>
  <text x="936" y="494" fill="#111" font-weight="bold">GND</text>
  <text x="846" y="472" text-anchor="middle" font-size="11">Green LED</text>
  <!-- yellow D7 -->
  <line x1="700" y1="550" x2="730" y2="550" stroke="#e67e00" stroke-width="2.5"/>
  <rect x="730" y="542" width="50" height="16" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="755" y="537" text-anchor="middle" font-size="11">220 Ω</text>
  <line x1="780" y1="550" x2="835" y2="550" stroke="#e67e00" stroke-width="2.5"/>
  <polygon points="835,539 835,561 858,550" fill="#f2c200" stroke="#333" stroke-width="1.5"/>
  <line x1="858" y1="539" x2="858" y2="561" stroke="#333" stroke-width="2.5"/>
  <line x1="858" y1="550" x2="930" y2="550" stroke="#111" stroke-width="2.5"/>
  <text x="936" y="554" fill="#111" font-weight="bold">GND</text>
  <text x="846" y="532" text-anchor="middle" font-size="11">Yellow LED</text>

  <!-- ================= LEGEND ================= -->
  <rect x="40" y="770" width="1040" height="116" rx="6" fill="#fafafa" stroke="#bbb"/>
  <g font-size="12">
    <line x1="60" y1="792" x2="90" y2="792" stroke="#d62020" stroke-width="3"/><text x="96" y="796">5V</text>
    <line x1="140" y1="792" x2="170" y2="792" stroke="#111" stroke-width="3"/><text x="176" y="796">GND</text>
    <line x1="230" y1="792" x2="260" y2="792" stroke="#1f6feb" stroke-width="3"/><text x="266" y="796">SDA (I2C)</text>
    <line x1="350" y1="792" x2="380" y2="792" stroke="#1a9a3a" stroke-width="3"/><text x="386" y="796">SCL (I2C)</text>
    <line x1="470" y1="792" x2="500" y2="792" stroke="#e67e00" stroke-width="3"/><text x="506" y="796">digital signal</text>
    <circle cx="620" cy="792" r="4.5" fill="#444"/><text x="632" y="796">dot = junction (crossing lines without a dot are not connected)</text>
  </g>
  <g font-size="12" fill="#222">
    <text x="60" y="818">• All points labeled 5V join the UNO 5V pin; all GND points join UNO GND (common ground). Use the breadboard rails.</text>
    <text x="60" y="838">• HC-05: the R1 1 kΩ / R2 2 kΩ divider on D11 → RXD is required (module RX is 3.3 V). HC-05 TXD can go straight to D10.</text>
    <text x="60" y="858">• Drive the buzzer through the NPN transistor (never directly from a pin). For a magnetic/coil buzzer, add a 1N4148 flyback diode (cathode to 5V).</text>
    <text x="60" y="878">• MPU6050 and LCD share the I2C bus (A4/A5). AD0 to GND → address 0x68. Power: car USB charger → USB cable to UNO (not 12 V to Vin).</text>
  </g>
</svg>
